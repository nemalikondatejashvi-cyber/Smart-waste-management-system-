<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Waste Management System</title>
<style>
:root{--green:#16845b;--deep:#105c43;--bg:#f4f7f5;--ink:#17231e;--muted:#718078;--line:#e4ebe6;--red:#d94b4b;--amber:#d18b25}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:white;font-weight:650}button:hover{filter:brightness(.95)}button.secondary{background:#eaf3ee;color:var(--deep)}button.danger{background:#fff0ef;color:#b83232}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#123d30;color:#eaf5ef;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px}.logo{width:40px;height:40px;border-radius:12px;background:#d7f4e5;color:#126345;display:grid;place-items:center;font-size:22px}.brand strong{display:block;font-size:15px}.brand small{color:#b5d3c5}.navlabel{font-size:10px;letter-spacing:1.5px;color:#9abaaa;padding:0 12px;margin-bottom:-12px}.nav button{display:flex;width:100%;text-align:left;gap:12px;background:transparent;color:#d8e9e0;padding:11px 12px;margin:3px 0;font-weight:550}.nav button.active,.nav button:hover{background:#245845;color:white}.sidefoot{margin-top:auto;color:#b5d3c5;font-size:12px;padding:10px}.main{min-width:0}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar small{color:var(--muted)}.user{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;background:#e2f3e9;color:var(--deep);border-radius:50%;display:grid;place-items:center;font-weight:800}.content{padding:28px 30px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}.pagehead h1{font-size:25px;margin:0 0 4px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #153d2a08}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .num{font-size:27px;font-weight:800;margin-top:7px}.iconbox{width:38px;height:38px;border-radius:11px;background:#eaf5ee;display:grid;place-items:center;font-size:19px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}.card h3{margin:0 0 14px;font-size:15px}.barrow{display:grid;grid-template-columns:100px 1fr 38px;gap:10px;align-items:center;margin:13px 0}.bar{height:9px;background:#edf2ef;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#36a878;border-radius:20px}.alert{display:flex;gap:10px;padding:12px;border-radius:10px;background:#fff7e9;margin:9px 0}.alert.red{background:#fff0ef}.alert b{display:block}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}td{font-size:13px}.pill{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#e8f5ed;color:#16704e}.pill.warn{background:#fff3dc;color:#9a6414}.pill.bad{background:#ffeded;color:#b83c3c}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.formgrid input,.formgrid select{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 11px;color:var(--ink)}.toolbar input{min-width:210px}.section{display:none}.section.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.formgrid label{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:12px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;gap:7px}.empty{text-align:center;padding:35px;color:var(--muted)}.login{max-width:390px;margin:8vh auto;background:white;border:1px solid var(--line);border-radius:18px;padding:28px}.login h2{margin:0 0 5px}.login input{width:100%;margin:8px 0 14px;padding:12px;border:1px solid var(--line);border-radius:9px}.toast{position:fixed;bottom:22px;right:22px;background:#173e30;color:white;padding:12px 17px;border-radius:10px;display:none;z-index:10}.footer{color:var(--muted);font-size:11px;text-align:center;margin:24px 0}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:4px}.nav{display:flex;overflow:auto}.navlabel,.sidefoot{display:none}.nav button{white-space:nowrap;width:auto}.topbar{padding:0 16px}.content{padding:20px 15px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px}.stat .num{font-size:22px}.pagehead{flex-direction:column}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.topbar{height:60px}}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const seedBins=[
{id:'BIN-101',area:'Main Market',type:'Dry',fill:92,status:'Overflow',last:'Today, 9:20 AM'},
{id:'BIN-102',area:'College Road',type:'Wet',fill:68,status:'Normal',last:'Today, 9:05 AM'},
{id:'BIN-103',area:'Bus Stand',type:'Mixed',fill:84,status:'Nearly Full',last:'Today, 8:45 AM'},
{id:'BIN-104',area:'Green Park',type:'Recyclable',fill:35,status:'Normal',last:'Today, 8:30 AM'},
{id:'BIN-105',area:'Hospital Area',type:'Wet',fill:97,status:'Overflow',last:'Today, 8:15 AM'}];
const seedCollections=[
{id:'COL-201',bin:'BIN-101',area:'Main Market',staff:'Ravi Kumar',weight:42,type:'Dry',date:'2026-11-22',status:'Completed'},
{id:'COL-202',bin:'BIN-102',area:'College Road',staff:'Sita Devi',weight:28,type:'Wet',date:'2026-11-22',status:'Completed'},
{id:'COL-203',bin:'BIN-103',area:'Bus Stand',staff:'Arjun',weight:0,type:'Mixed',date:'2026-11-22',status:'Pending'}];
let bins=JSON.parse(localStorage.getItem('swms_bins')||'null')||seedBins;
let collections=JSON.parse(localStorage.getItem('swms_cols')||'null')||seedCollections;
let role='Admin',page='dashboard';
function save(){localStorage.setItem('swms_bins',JSON.stringify(bins));localStorage.setItem('swms_cols',JSON.stringify(collections))}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function statusPill(s){let c=s==='Overflow'?'bad':(s==='Nearly Full'||s==='Pending'?'warn':'');return `<span class="pill ${c}">${s}</span>`}
function layout(){ $('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">♻</div><div><strong>EcoTrack SWMS</strong><small>Smart Waste Management</small></div></div><div class="navlabel">WORKSPACE</div><nav class="nav">
${[['dashboard','▦','Dashboard'],['bins','▤','Bin Management'],['collections','♻','Waste Collections'],['reports','▥','Reports & Analytics'],['users','♙','Users & Activity']].map(([id,ic,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join('')}</nav><div class="sidefoot">● Demo environment<br>Sample data stored on this device</div></aside><main class="main"><header class="topbar"><div><b>Smart Waste Management</b><br><small>Clean streets. Smarter cities.</small></div><div class="user"><select onchange="role=this.value;render()" aria-label="Switch demo role"><option>Admin</option><option>Collection Staff</option><option>Public User</option></select><div class="avatar">${role[0]}</div></div></header><div class="content" id="view"></div></main></div>`;render()}
function go(p){page=p;layout()}
function head(title,sub,btn=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${btn}</div>`}
function render(){let v=$('#view');if(!v)return;
if(page==='dashboard')v.innerHTML=dashboard();
if(page==='bins')v.innerHTML=binsPage();
if(page==='collections')v.innerHTML=collectionsPage();
if(page==='reports')v.innerHTML=reportsPage();
if(page==='users')v.innerHTML=usersPage();
}
function dashboard(){let overflow=bins.filter(b=>b.fill>=90).length,avg=Math.round(bins.reduce((a,b)=>a+Number(b.fill),0)/Math.max(1,bins.length)),kg=collections.reduce((a,c)=>a+Number(c.weight||0),0);
return `${head('Dashboard','Overview of waste operations across your city',`<button onclick="go('collections')">＋ Record Collection</button>`)}
<div class="stats">${[['Total Bins',bins.length,'▤'],['Collected Waste',kg+' kg','♻'],['Overflow Alerts',overflow,'⚠'],['Average Bin Fill',avg+'%','◷']].map(x=>`<div class="card stat"><div><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div><div class="iconbox">${x[2]}</div></div>`).join('')}</div>
<div class="grid2"><div class="card"><h3>Bin Fill-Level Monitoring</h3>${bins.slice(0,6).map(b=>`<div class="barrow"><span>${b.id}</span><div class="bar"><span style="width:${Math.min(100,b.fill)}%;background:${b.fill>=90?'#d94b4b':b.fill>=75?'#d18b25':'#36a878'}"></span></div><b>${b.fill}%</b></div>`).join('')}</div><div class="card"><h3>Active Alerts</h3>${bins.filter(b=>b.fill>=80).map(b=>`<div class="alert ${b.fill>=90?'red':''}"><span>⚠</span><div><b>${b.status}: ${b.id}</b><span class="muted">${b.area} · ${b.fill}% full</span></div></div>`).join('')||'<div class="empty">No active alerts</div>'}</div></div>
<div class="card"><h3>Recent Collection Activity</h3>${collectionTable(collections.slice().reverse().slice(0,5),false)}</div>`}
function binsPage(){return `${head('Bin Management','Register bins and monitor their fill levels',`<button onclick="binForm()">＋ Add New Bin</button>`)}<div class="card"><div class="toolbar"><input id="binSearch" placeholder="Search bin or area..." oninput="filterBins()"><select id="binFilter" onchange="filterBins()"><option value="">All statuses</option><option>Normal</option><option>Nearly Full</option><option>Overflow</option></select></div><div class="tablewrap"><table><thead><tr><th>Bin ID</th><th>Area</th><th>Waste Type</th><th>Fill Level</th><th>Status</th><th>Last Updated</th><th>Actions</th></tr></thead><tbody id="binRows">${binRows(bins)}</tbody></table></div></div>`}
function binRows(arr){return arr.map(b=>`<tr><td><b>${b.id}</b></td><td>${b.area}</td><td>${b.type}</td><td>${b.fill}%</td><td>${statusPill(b.status)}</td><td>${b.last}</td><td><div class="actions"><button class="secondary" onclick="editBin('${b.id}')">Edit</button><button class="danger" onclick="deleteBin('${b.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No bins found</td></tr>'}
function filterBins(){let q=$('#binSearch').value.toLowerCase(),s=$('#binFilter').value;$('#binRows').innerHTML=binRows(bins.filter(b=>(b.id+b.area).toLowerCase().includes(q)&&(!s||b.status===s)))}
function binForm(id){let b=bins.find(x=>x.id===id)||{id:'',area:'',type:'Wet',fill:0};$('#view').innerHTML=`${head(id?'Edit Bin':'Add New Bin','Enter waste bin details')}<div class="card"><form class="formgrid" onsubmit="saveBin(event,'${id||''}')"><label>Bin ID<input name="id" required value="${b.id}" ${id?'readonly':''}></label><label>Area / Location<input name="area" required value="${b.area}"></label><label>Waste Type<select name="type">${['Wet','Dry','Recyclable','Mixed','Hazardous'].map(t=>`<option ${b.type===t?'selected':''}>${t}</option>`)}</select></label><label>Fill Level (%)<input name="fill" type="number" min="0" max="100" required value="${b.fill}"></label><div class="wide"><button>Save Bin</button> <button type="button" class="secondary" onclick="go('bins')">Cancel</button></div></form></div>`}
function saveBin(e,id){e.preventDefault();let f=new FormData(e.target),fill=+f.get('fill');let b={id:f.get('id').trim(),area:f.get('area').trim(),type:f.get('type'),fill,status:fill>=90?'Overflow':fill>=75?'Nearly Full':'Normal',last:'Just now'};if(id)bins=bins.map(x=>x.id===id?b:x);else{if(bins.some(x=>x.id===b.id)){toast('Bin ID already exists');return}bins.push(b)}save();toast('Bin saved successfully');go('bins')}
function editBin(id){binForm(id)}function deleteBin(id){if(confirm('Delete '+id+'?')){bins=bins.filter(b=>b.id!==id);save();render();toast('Bin deleted')}}
function collectionsPage(){return `${head('Waste Collections','Assign staff and record completed waste pickups',`<button onclick="collectionForm()">＋ Add Collection</button>`)}<div class="card"><div class="toolbar"><input id="colSearch" placeholder="Search collection, bin or staff..." oninput="filterCols()"><select id="colFilter" onchange="filterCols()"><option value="">All statuses</option><option>Completed</option><option>Pending</option></select></div><div id="colTable">${collectionTable(collections,true)}</div></div>`}
function collectionTable(arr,actions){return `<div class="tablewrap"><table><thead><tr><th>Record ID</th><th>Bin / Area</th><th>Assigned Staff</th><th>Waste Type</th><th>Weight</th><th>Date</th><th>Status</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${arr.map(c=>`<tr><td><b>${c.id}</b></td><td>${c.bin}<br><span class="muted">${c.area}</span></td><td>${c.staff}</td><td>${c.type}</td><td>${c.weight} kg</td><td>${c.date}</td><td>${statusPill(c.status)}</td>${actions?`<td><button class="secondary" onclick="toggleCol('${c.id}')">${c.status==='Completed'?'Reopen':'Complete'}</button></td>`:''}</tr>`).join('')||`<tr><td colspan="8" class="empty">No collection records yet</td></tr>`}</tbody></table></div>`}
function filterCols(){let q=$('#colSearch').value.toLowerCase(),s=$('#colFilter').value;$('#colTable').innerHTML=collectionTable(collections.filter(c=>(c.id+c.bin+c.staff+c.area).toLowerCase().includes(q)&&(!s||c.status===s)),true)}
function collectionForm(){let opts=bins.map(b=>`<option value="${b.id}">${b.id} — ${b.area}</option>`).join('');$('#view').innerHTML=`${head('Record Waste Collection','Add a pickup record and update collection status')}<div class="card"><form class="formgrid" onsubmit="saveCollection(event)"><label class="wide">Select Bin<select name="bin" required>${opts}</select></label><label>Collection Staff<input name="staff" required placeholder="Staff name"></label><label>Waste Type<select name="type">${['Wet','Dry','Recyclable','Mixed','Hazardous'].map(x=>`<option>${x}</option>`)}</select></label><label>Collected Weight (kg)<input name="weight" type="number" min="0" step=".1" required></label><label>Collection Date<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Status<select name="status"><option>Completed</option><option>Pending</option></select></label><div class="wide"><button>Save Collection</button> <button type="button" class="secondary" onclick="go('collections')">Cancel</button></div></form></div>`}
function saveCollection(e){e.preventDefault();let f=new FormData(e.target),b=bins.find(x=>x.id===f.get('bin'));collections.push({id:'COL-'+(Date.now().toString().slice(-6)),bin:b.id,area:b.area,staff:f.get('staff'),type:f.get('type'),weight:+f.get('weight'),date:f.get('date'),status:f.get('status')});if(f.get('status')==='Completed')b.fill=0;save();toast('Collection recorded');go('collections')}
function toggleCol(id){let c=collections.find(x=>x.id===id);c.status=c.status==='Completed'?'Pending':'Completed';save();render();toast('Collection status updated')}
function reportsPage(){let total=collections.reduce((a,c)=>a+Number(c.weight||0),0),done=collections.filter(c=>c.status==='Completed').length,types=['Wet','Dry','Recyclable','Mixed','Hazardous'];return `${head('Reports & Analytics','Summary of waste generation and collection performance',`<button onclick="exportCSV()">↓ Export CSV</button>`)}<div class="stats"><div class="card"><div class="muted">Total Waste Recorded</div><div class="num">${total} kg</div></div><div class="card"><div class="muted">Completed Pickups</div><div class="num">${done}</div></div><div class="card"><div class="muted">Pending Pickups</div><div class="num">${collections.length-done}</div></div><div class="card"><div class="muted">Registered Bins</div><div class="num">${bins.length}</div></div></div><div class="grid2"><div class="card"><h3>Waste by Category</h3>${types.map(t=>{let n=collections.filter(c=>c.type===t).reduce((a,c)=>a+Number(c.weight||0),0),p=total?Math.round(n/total*100):0;return `<div class="barrow"><span>${t}</span><div class="bar"><span style="width:${p}%"></span></div><b>${n} kg</b></div>`}).join('')}</div><div class="card"><h3>System Summary</h3><p>Bin capacity alerts: <b>${bins.filter(b=>b.fill>=90).length}</b></p><p>Average fill level: <b>${Math.round(bins.reduce((a,b)=>a+b.fill,0)/Math.max(1,bins.length))}%</b></p><p>Collection completion: <b>${collections.length?Math.round(done/collections.length*100):0}%</b></p><p class="muted">Reports are calculated from records stored in this browser.</p></div></div><div class="card"><h3>Collection Records</h3>${collectionTable(collections,false)}</div>`}
function exportCSV(){let rows=[['ID','Bin','Area','Staff','Type','Weight kg','Date','Status'],...collections.map(c=>[c.id,c.bin,c.area,c.staff,c.type,c.weight,c.date,c.status])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='waste-collection-report.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV report exported')}
function usersPage(){return `${head('Users & Activity','Demo roles and recent system activity')}<div class="grid2"><div class="card"><h3>System Roles</h3><p><b>Administrator</b><br><span class="muted">Manage bins, collections, reports and users.</span></p><p><b>Collection Staff</b><br><span class="muted">Record pickups and update collection status.</span></p><p><b>Public User</b><br><span class="muted">View dashboard and waste status.</span></p><p class="muted">Use the role selector in the top-right to preview the interface role.</p></div><div class="card"><h3>Recent Activity</h3><div class="alert">✓ <div><b>Dashboard initialized</b><span class="muted">Sample records loaded</span></div></div><div class="alert">♻ <div><b>${collections.length} collection records</b><span class="muted">Currently stored in this browser</span></div></div><div class="alert">▤ <div><b>${bins.length} waste bins registered</b><span class="muted">Current system data</span></div></div><button class="danger" onclick="if(confirm('Reset all demo data?')){bins=seedBins.map(x=>({...x}));collections=seedCollections.map(x=>({...x}));save();render();toast('Demo data reset')}">Reset Demo Data</button></div></div>`}
layout();
</script>
</body></html>
